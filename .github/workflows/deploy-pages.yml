# Publishes AFTERHOURS to GitHub Pages on every push to main.
#
# The configure-pages step tries to enable Pages automatically. If that is
# refused, do it once by hand: Settings → Pages → Source: "GitHub Actions".
# The site then lives at https://<owner>.github.io/<repo>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'afterhours/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afterhours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afterhours/package-lock.json
      - run: npm ci
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm run build
        env:
          # Pages serves the site under /<repo>/, so assets need that prefix.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: afterhours/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
