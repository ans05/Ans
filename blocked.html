<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locked In</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">You're locked in</p>
    <h1 id="site">This site is blocked</h1>
    <p class="timer" id="timer">--:--</p>
    <p class="sub" id="sub">until your session ends.</p>

    <section class="tasks">
      <h2>What you said you'd do</h2>
      <ul id="task-list"></ul>
    </section>

    <div class="actions">
      <button id="back">Go back</button>
      <button id="end" class="ghost" hidden>End session early</button>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
