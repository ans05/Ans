<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lock In</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1>Lock In</h1>
    <span id="status-pill" class="pill">Idle</span>
  </header>

  <!-- Session controls -->
  <section id="session" class="card">
    <p id="timer" class="timer">25:00</p>
    <p id="session-note" class="note">Pick a length and lock in.</p>

    <div id="setup">
      <div class="durations" role="group" aria-label="Session length">
        <button class="chip" data-minutes="25">25m</button>
        <button class="chip active" data-minutes="50">50m</button>
        <button class="chip" data-minutes="90">90m</button>
        <label class="chip custom">
          <input type="number" id="custom-minutes" min="1" max="600" placeholder="min">
        </label>
      </div>
      <label class="check">
        <input type="checkbox" id="strict-mode">
        Strict mode (no ending early)
      </label>
      <button id="start-lock-in" class="primary">Lock In</button>
    </div>

    <div id="running" hidden>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <button id="end-lock-in" class="secondary">End early</button>
    </div>
  </section>

  <!-- Task list -->
  <section id="tasks" class="card">
    <h2>Tasks</h2>
    <form id="task-form" class="row">
      <input type="text" id="new-task" placeholder="What are you working on?" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="task-list" class="list"></ul>
    <button id="clear-done" class="link">Clear completed</button>
  </section>

  <!-- Site blocker -->
  <section id="blocker" class="card">
    <h2>Blocked while locked in</h2>
    <form id="block-form" class="row">
      <input type="text" id="block-url" placeholder="e.g. youtube.com" autocomplete="off">
      <button type="submit">Block</button>
    </form>
    <ul id="blocked-list" class="list"></ul>
    <div class="row">
      <button id="add-presets" class="link">Add common distractions</button>
      <button id="clear-blocked-list" class="link danger">Clear all</button>
    </div>
  </section>

  <footer id="stats" class="stats">
    <span><strong id="stat-sessions">0</strong> sessions</span>
    <span><strong id="stat-minutes">0</strong> min locked in</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
